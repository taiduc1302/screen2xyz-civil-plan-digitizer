name: Public source boundary
on:
  push:
    branches: [main, feature/assisted-c03-validation, task/plan-layer-extraction]
  pull_request:
permissions:
  contents: read
jobs:
  source-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s publication_snapshot_tests -v
      - run: python tools/publication_check.py
