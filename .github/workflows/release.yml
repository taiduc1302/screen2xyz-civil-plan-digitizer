name: release

on:
  push:
    tags: ["v2.5.*"]

permissions:
  contents: write

jobs:
  test:
    name: release tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        run: choco install tesseract -y --no-progress
      - name: Application tests
        shell: bash
        run: PYTHONPATH=src python -m unittest discover -s tests_app -t . -v
      - name: Civil tests
        shell: bash
        run: PYTHONPATH=src python tests_civil/run_civil_tests.py
      - name: M2 regression tests
        shell: bash
        run: PYTHONPATH=src python -m unittest discover -s tests_m2 -t . -v
      - name: Windows Tk smoke
        if: runner.os == 'Windows'
        shell: bash
        run: PYTHONPATH=src python tests_app/tk_smoke.py --output .tk-smoke
      - name: Real OCR proof
        shell: bash
        run: PYTHONPATH=src python -m tests_app.harness --output .harness-output
      - name: Publish proof metrics
        if: always()
        shell: bash
        run: |
          if [ -f .harness-output/summary.md ]; then
            cat .harness-output/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  build-windows:
    name: build Windows bundle
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-build.txt
      - name: Build Screen2XYZ-Setup
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Smoke packaged executable
        shell: pwsh
        run: ./packaging/smoke_bundle.ps1
      - name: Package and checksum
        shell: pwsh
        run: |
          $archive = "Screen2XYZ-${{ github.ref_name }}-windows-x64.zip"
          Compress-Archive -Path dist/Screen2XYZ-Setup -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Screen2XYZ-${{ github.ref_name }}-windows-x64
          path: |
            Screen2XYZ-${{ github.ref_name }}-windows-x64.zip
            SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            Screen2XYZ-${{ github.ref_name }}-windows-x64.zip
            SHA256SUMS.txt
