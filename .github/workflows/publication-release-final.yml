name: Verified research source release
on:
  push:
    branches: ['docs/publication-readiness-2026-09-22']
    paths: ['.github/workflows/publication-release-final.yml']
concurrency:
  group: publication-cleanup-20260922
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  research-extra:
    if: github.repository == 'taiduc1302/screen2xyz-civil-plan-digitizer' && github.actor == 'taiduc1302'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5c6e80079239e6efeb55bce9f89c327a2f259681
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: maintenance-candidate-data
          path: ${{ runner.temp }}/candidate-data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35752904631
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install branch requirements and explicit test-only optional geometry packages
        shell: bash
        run: |
          python -m pip install -r requirements-civil.txt
          python -m pip install 'PyMuPDF>=1.27,<2' 'Shapely>=2.1,<3'
      - name: Test actual optional geometry and the external Screen2XYZ stdio server
        shell: bash
        env:
          SCREEN2XYZ_RUN_OPERATOR_LIVE: '1'
        run: |
          python "$RUNNER_TEMP/candidate-data/validate.py" --out "$RUNNER_TEMP/optional-validation" --kind research
      - name: Record the exact optional environment and executed test report
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'optional-validation'
          root.mkdir(exist_ok=True)
          p = root / 'validation-research.json'
          if p.exists():
              result = json.loads(p.read_text())
              result['optional_packages'] = subprocess.check_output(['python','-m','pip','freeze']).decode().splitlines()
              result['external_screen2xyz_stdio_enabled'] = True
              result['source_run_url'] = 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
              (root / 'validation-optional.json').write_text(json.dumps(result, indent=2))
              p.unlink()
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: optional-geometry-validation
          path: ${{ runner.temp }}/optional-validation/
          if-no-files-found: error
          retention-days: 14
  publication:
    needs: research-extra
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: maintenance-candidate-data
          path: ${{ runner.temp }}/candidate-data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35752904631
      - uses: actions/download-artifact@v7
        with:
          pattern: validated-*
          path: ${{ runner.temp }}/validations
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35752904631
      - uses: actions/download-artifact@v7
        with:
          name: optional-geometry-validation
          path: ${{ runner.temp }}/validations/optional
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Bind publication to already-cleaned and exactly tested source heads
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'candidate-data'
          tags = json.loads((root / 'tag-objects.json').read_text())
          for expected, text in tags.items():
              observed = subprocess.check_output(['git','hash-object','-w','-t','tag','--stdin'],input=text.encode()).decode().strip()
              assert observed == expected
          p = root / 'publish.py'
          code = p.read_text()
          begin = code.index('current=refs_remote(root);')
          end = code.index('run_id=os.environ', begin)
          replacement = '''optional_files = list(valid.rglob('validation-optional.json'))
          if len(optional_files) != 1: raise RuntimeError('Missing optional validation')
          optional = json.loads(optional_files[0].read_text())
          if optional['result'] != 'PASS' or optional['checked_sha'] != rows['refs/heads/'+PILOT]['new']:
           raise RuntimeError('Optional validation does not match exact source')
          optional['branch'] = 'research with optional geometry and stdio'
          reports.append(optional)
          current=refs_remote(root)
          allow={r:(v['new'] if r.startswith('refs/heads/') else v['old']) for r,v in rows.items()}
          allow['refs/heads/'+MAINTENANCE]=os.environ['GITHUB_SHA']
          allow['refs/heads/'+CANDIDATE]=info['checkpoint_sha']
          if current != allow: raise RuntimeError('Concurrent ref change: publication stopped')
          for r,v in rows.items():
           v['old']=allow[r]
           if r == 'refs/heads/'+MAINTENANCE: v['new']=allow[r]
          '''
          code = code[:begin] + replacement + code[end:]
          code = code.replace("run_url='https://github.com/'+repo+'/actions/runs/'+run_id", "run_url='https://github.com/'+repo+'/actions/runs/35752904631'")
          code = code.replace("if not ref.startswith('refs/heads/'):continue", "if not ref.startswith('refs/heads/') or ref == 'refs/heads/'+MAINTENANCE:continue")
          code = code.replace("| Tests run | Skipped | Exit |", "| Tests discovered | Skipped | Exit |")
          code = code.replace("section+='Both the main baseline", "section+='Supplemental optional-geometry/stdio run: '+optional['source_run_url']+'\\n\\n'\nsection+='Both the main baseline")
          code = code.replace("run(root,'push','--atomic',*leases,'origin',*specs)", "\ntry:\n run(root,'push','--atomic',*leases,'origin',*specs)\nexcept subprocess.CalledProcessError as exc:\n print((exc.stderr or b'').decode('utf-8','replace'), flush=True)\n raise\n")
          code = code.replace("'Both baseline and research synthetic test suites passed in '+run_url+'.\\n'", "'Executed synthetic/unit suites and explicit skips are documented in publication/validation.json. '+run_url+'\\n'")
          compile(code,str(p),'exec')
          p.write_text(code)
          PY
      - name: Publish proof records, clean tag, and reviewed source archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python "$RUNNER_TEMP/candidate-data/publish.py" "$RUNNER_TEMP/candidate-data" "$RUNNER_TEMP/validations" "$RUNNER_TEMP/public-release"
      - name: Independently fetch ordinary refs again and check their reachable history
        shell: bash
        run: |
          git init -q "$RUNNER_TEMP/final-source-check"
          git -C "$RUNNER_TEMP/final-source-check" fetch -q "https://github.com/$GITHUB_REPOSITORY.git" '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
          python "$RUNNER_TEMP/candidate-data/audit_clean.py" "$RUNNER_TEMP/final-source-check" > "$RUNNER_TEMP/public-release/final-history-check.json"
          cat "$RUNNER_TEMP/public-release/final-history-check.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-source-release-result
          path: ${{ runner.temp }}/public-release/
          if-no-files-found: warn
          retention-days: 30
