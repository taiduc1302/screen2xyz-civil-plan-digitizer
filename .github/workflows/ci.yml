name: ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  headless:
    name: headless tests (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Screen2XYZ v2 core
        run: PYTHONPATH=src python -m unittest discover -s tests_app -t . -v
      - name: Civil regression
        run: PYTHONPATH=src python tests_civil/run_civil_tests.py

  windows:
    name: full tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Screen2XYZ v2 core
        shell: bash
        run: PYTHONPATH=src python -m unittest discover -s tests_app -t . -v
      - name: Civil regression
        shell: bash
        run: PYTHONPATH=src python tests_civil/run_civil_tests.py
