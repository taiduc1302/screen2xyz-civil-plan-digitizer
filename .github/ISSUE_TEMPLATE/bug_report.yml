name: Bug report
description: Report a reproducible civil digitizer problem
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what should have happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps using synthetic data only.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Sanitized test output or screenshots consistent with CONTRIBUTING.md and AGENTS.md.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable result defines the fix?
